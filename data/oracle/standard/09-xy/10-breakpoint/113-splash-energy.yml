name: Splash Energy

origin: breakpoint-113

layout: Standard

category:
  - Energy

trait:
  - Special

rule:
  - type: Effect
    text: This card can only be attached to Water Pokémon. This card provides Water Energy only while this card is attached to a Water Pokémon.
  - type: Effect
    text: If the Water Pokémon this card is attached to is Knocked Out by damage from an opponent's attack, put that Pokémon into your hand. (Discard all cards attached to it.)
  - type: Effect
    text: (If this card is attached to anything other than a Water Pokémon, discard this card.)

errata: []
