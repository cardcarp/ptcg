rule:
  - type: Effect
    text: This card can only be attached to Darkness Pokémon. This card provides Darkness Energy only while this card is attached to a Darkness Pokémon.
  - type: Effect
    text: Whenever the Darkness Pokémon this card is attached to is your Active Pokémon and is damaged by an attack from your opponent's Pokémon-EX (even if that Pokémon is Knocked Out), put 2 damage counters on the Attacking Pokémon-EX.
  - type: Effect
    text: (If this card is attached to anything other than a Darkness Pokémon, discard this card.)

