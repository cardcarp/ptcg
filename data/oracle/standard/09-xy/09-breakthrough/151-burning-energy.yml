name: Burning Energy

origin: breakthrough-151

layout: Standard

category:
  - Energy

trait:
  - Special

rule:
  - type: Effect
    text: This card can only be attached to Fire Pokémon. This card provides Fire Energy only while this card is attached to a Fire Pokémon.
  - type: Effect
    text: If this card is discarded by an attack of the Fire Pokémon this card is attached to, attach this card from your discard pile to that Pokémon after attacking.
  - type: Effect
    text: (If this card is attached to anything other than a Fire Pokémon, discard this card.)

errata: []
