name: Miracle Berry

origin: neo-genesis-094

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: Attach Miracle Berry to 1 of your Pokémon that doesn't have a Pokémon Tool attached to it.
  - type: effect
    text: At any time between turns, if the Pokémon Miracle Berry is attached to is Asleep, Confused, Paralyzed, or Poisoned, you may remove all those effects from that Pokémon and discard Miracle Berry. At the start of each turn, if the Pokémon Miracle Berry is attached to is Asleep, Confused, Paralyzed, or Poisoned, remove all of those effects from that Pokémon and discard Miracle Berry.

