name: Counterattack Claws

origin: neo-destiny-097

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Counterattack Claws to 1 of your Pokémon that doesn't have a Pokémon Tool attached to it.
  - type: Effect
    text: During your opponent's turn, if the Pokémon Counterattack Claws is attached to is your Active Pokémon and an opponent's attack damages it (even if it is Knocked Out), flip a coin. If heads, put 2 damage counters on the Defending Pokémon. Then, discard Counterattack Claws.

errata: []
