rule:
  - type: Effect
    text: Attach EXP.ALL to 1 of your Pokémon that doesn't have a Pokémon Tool attached to it.
  - type: Effect
    text: During your opponent's turn, if your Active Pokémon would be Knocked Out by your opponent's attack, you may take 1 of the basic Energy cards attached to your Active Pokémon and attach it to the Pokémon with EXP.ALL attached to it. If you do, discard EXP.ALL.

