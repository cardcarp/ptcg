name: Tyme

origin: surging-sparks-190

layout: Standard

category:
  - Trainer

trait:
  - Supporter

rule:
  - type: Effect
    text: Tell your opponent the name of a Pokémon in your hand and put that Pokémon face down in front of you. Your opponent guesses that Pokémon's HP, and then you reveal it. If your opponent guessed right, they draw 4 cards. If they guessed wrong, you draw 4 cards. Then, return the Pokémon to your hand.

rulebox:
  - You may play only 1 Supporter card during your turn.

errata: []
