name: Passho Berry

origin: surging-sparks-184

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rulebox:
  - If the Pokémon this card is attached to is damaged by an attack from your opponent's Water Pokémon, it takes 60 less damage (after applying Weakness and Resistance), and discard this card.
  - You may attach any number of Pokémon Tools to your Pokémon during your turn. You may attach only 1 Pokémon Tool to each Pokémon, and it stays attached.
  - Attach a Pokémon Tool to 1 of your Pokémon that doesn't already have a Pokémon Tool attached.

