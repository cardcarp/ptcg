name: Luxurious Cape

origin: paradox-rift-166

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: If the Pokémon this card is attached to doesn't have a Rule Box, it gets +100 HP, and if it is Knocked Out by damage from an attack from your opponent's Pokémon, that player takes 1 more Prize card. (Pokémon ex, Pokémon V, etc. have Rule Boxes.)

rulebox:
  - You may attach any number of Pokémon Tools to your Pokémon during your turn. You may attach only 1 Pokémon Tool to each Pokémon, and it stays attached.

