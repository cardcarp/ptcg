name: Neutralization Zone

origin: shrouded-fable-060

layout: standard

category: Trainer

facet:
  - Stadium
  - ACE SPEC

rule:
  - type: effect
    text: Prevent all damage done to Pokémon that don't have a Rule Box (both yours and your opponent's) by attacks from the opponent's Pokémon ex and Pokémon V. (Pokémon ex, Pokémon V, etc. have Rule Boxes.) This card can't be put into your hand or deck from the discard pile.

rulebox:
  - You can't have more than 1 ACE SPEC card in your deck.
  - You may play only 1 Stadium card during your turn. Put it next to the Active Spot, and discard it if another Stadium comes into play. A Stadium with the same name can't be played.

regulation:
  - H

errata: []
