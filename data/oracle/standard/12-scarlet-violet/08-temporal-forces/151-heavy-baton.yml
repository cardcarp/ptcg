name: Heavy Baton

origin: temporal-forces-151

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: If the Pokémon this card is attached to has a Retreat Cost of exactly 4, is in the Active Spot, and is Knocked Out by damage from an attack from your opponent's Pokémon, move up to 3 Basic Energy cards from that Pokémon to your Benched Pokémon in any way you like.

rulebox:
  - You may attach any number of Pokémon Tools to your Pokémon during your turn. You may attach only 1 Pokémon Tool to each Pokémon, and it stays attached.

regulation:
  - H

