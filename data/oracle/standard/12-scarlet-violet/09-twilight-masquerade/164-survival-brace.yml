name: Survival Brace

origin: twilight-masquerade-164

layout: standard

category: Trainer

facet:
  - Pokémon Tool
  - ACE SPEC

rule:
  - type: effect
    text: If the Pokémon this card is attached to has full HP and would be Knocked Out by damage from an attack from your opponent's Pokémon, it is not Knocked Out, and its remaining HP becomes 10. Then, discard this card.

rulebox:
  - You can't have more than 1 ACE SPEC card in your deck.
  - You may attach any number of Pokémon Tools to your Pokémon during your turn. You may attach only 1 Pokémon Tool to each Pokémon, and it stays attached.
  - Attach a Pokémon Tool to 1 of your Pokémon that doesn't already have a Pokémon Tool attached.
  - "ACE SPEC: You can't have more than 1 ACE SPEC card in your deck."

regulation:
  - H

errata: []
