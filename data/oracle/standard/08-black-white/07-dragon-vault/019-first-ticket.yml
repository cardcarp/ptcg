name: First Ticket

origin: dragon-vault-019

layout: Standard

category:
  - Trainer

trait:
  - Item

rule:
  - type: Effect
    text: Before you flip a coin to decide who goes first in a game, you may play this card. Don't flip that coin, and you go first. If both players play First Ticket, flip the coin as normal. (You may play only 1 First Ticket before you flip that coin.)

rulebox:
  - You may play as many Item cards as you like during your turn (before your attack).

errata: []
