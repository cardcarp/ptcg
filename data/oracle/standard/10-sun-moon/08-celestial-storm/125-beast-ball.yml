name: Beast Ball

origin: celestial-storm-125

layout: standard

category: Trainer

facet:
  - Item

rule:
  - type: effect
    text: Look at your face-down Prize cards. You may reveal an Ultra Beast card you find there, put it into your hand, and put this Beast Ball in its place. (If you don't reveal an Ultra Beast card, put this card in the discard pile.) Then, shuffle your face-down Prize cards.

rulebox:
  - You may play as many Item cards as you like during your turn (before your attack).

