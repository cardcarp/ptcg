    text: You may play 2 Custom Catcher cards at once. • If you played 1 card, draw cards until you have 3 cards in your hand. • If you played 2 cards, switch 1 of your opponent's Benched Pokémon with their Active Pokémon. (This effects works one time for 2 cards.)

