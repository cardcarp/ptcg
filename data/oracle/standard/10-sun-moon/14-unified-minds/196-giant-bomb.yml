name: Giant Bomb

origin: unified-minds-196

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: If this card is attached to 1 of your Pokémon, discard it at the end of your opponent's turn.
  - type: effect
    text: If the Pokémon this card is attached to is your Active Pokémon and takes 180 or more damage from an opponent's attack (even if this Pokémon is Knocked Out), put 10 damage counters on the Attacking Pokémon.

rulebox:
  - Attach a Pokémon Tool to 1 of your Pokémon that doesn't already have a Pokémon Tool attached to it.
  - You may play as many Item cards as you like during your turn (before your attack).

