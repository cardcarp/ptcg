name: Red & Blue

origin: cosmic-eclipse-202

layout: Standard

category:
  - Trainer

trait:
  - Supporter
  - TAG TEAM

rule:
  - type: Effect
    text: Search your deck for a Pokémon-GX that evolves from 1 of your Pokémon and put it onto that Pokémon to evolve it. Then, shuffle your deck. (You can't use this card during your first turn or on a Pokémon that was put into play this turn.)
  - type: Effect
    text: When you play this card, you may discard 2 other cards from your hand. If you do, search your deck for up to 2 basic Energy cards and attach them to the Pokémon you evolved in this way.

rulebox:
  - You may play only 1 Supporter card during your turn (before your attack).

