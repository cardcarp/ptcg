name: Strength Charm

origin: expedition-base-set-150

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Strength Charm to 1 of your Pokémon that doesn't have a Pokémon Tool attached to it.
  - type: Effect
    text: Whenever an attack from the Pokémon that Strength Charm is attached to does damage (after applying Weakness and Resistance), the attack does 10 more damage. At the end of your turn in which this happens, discard Strength Charm.

errata: []
