name: Bench Shield

origin: arceus-083

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Bench Shield to 1 of your Pokémon that doesn't already have a Pokémon Tool attached to it. If that Pokémon is Knocked Out, discard this card.
  - type: Effect
    text: As long as the Pokémon this card is attached to is on your Bench, prevent all damage done to that Pokémon by attacks (both yours and your opponent's).

