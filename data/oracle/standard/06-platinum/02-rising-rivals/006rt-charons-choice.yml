name: Charon's Choice

origin: rising-rivals-006rt

layout: Standard

category:
  - Trainer

trait:
  - Supporter

rule:
  - type: Effect
    text: Search your deck for any Rotom and switch it with any Rotom you have in play. Any cards attached to Rotom and damage counters on it are now on the new Pokémon. (Remove all Special Conditions and effects from Rotom.) Put Rotom on top of your deck. Shuffle your deck afterward.

rulebox:
  - You can play only one Supporter card each turn. When you play this card, put it next to your Active Pokémon. When your turn ends, put this card into your hand instead of discarding it.

errata: []
