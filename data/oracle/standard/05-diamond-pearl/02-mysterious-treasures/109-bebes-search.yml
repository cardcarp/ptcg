name: Bebe's Search

origin: mysterious-treasures-109

layout: Standard

category:
  - Trainer

trait:
  - Supporter

rule:
  - type: Effect
    text: Choose a card from your hand and put it on top of your deck. Search your deck for a Pokémon, show it to your opponent, and put it into your hand. Shuffle your deck afterward. (If this is the only card in your hand, you can't play this card.)

rulebox:
  - You can play only one Supporter card each turn. When you play this card, put it next to your Active Pokémon. When your turn ends, discard this card.

errata: []
