name: Fossil Excavator

origin: mysterious-treasures-111

layout: standard

category: Trainer

facet:
  - Supporter

rule:
  - type: effect
    text: Search your deck or discard pile for a Trainer card that has Fossil in its name or a Stage 1 or Stage 2 Evolution card that evolves from a Fossil. Show it to your opponent and put it into your hand. If you searched your deck, shuffle your deck afterward.

rulebox:
  - You can play only one Supporter card each turn. When you play this card, put it next to your Active Pokémon. When your turn ends, discard this card.

