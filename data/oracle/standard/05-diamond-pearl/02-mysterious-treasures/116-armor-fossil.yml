name: Armor Fossil

origin: mysterious-treasures-116

layout: Standard

category:
  - Trainer

trait:
  - Item

hp: 50

rule:
  - type: Effect
    text: Play Armor Fossil as if it were a Colorless Basic Pokémon. (Armor Fossil counts as a Trainer card as well, but if Armor Fossil is Knocked Out, this counts as a Knocked Out Pokémon.) Armor Fossil can't be affected by any Special Conditions and can't retreat. At any time during your turn before your attack, you may discard Armor Fossil from play. (This doesn't count as a Knocked Out Pokémon.)
  - type: Ability
    name: Armor Stone
    text: Whenever Armor Fossil would be damaged by your opponent's attack, flip a coin until you get tails. For each heads, reduce that damage by 10.

errata: []
