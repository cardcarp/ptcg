name: Energy Link

origin: stormfront-083

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Energy Link to 1 of your Pokémon that doesn't already have a Pokémon Tool attached to it. If that Pokémon is Knocked Out, discard this card.
  - type: Effect
    text: As long as Energy Link is attached to a Pokémon, you may move an Energy card attached to that Pokémon to another of your Pokémon that has Energy Link attached to it. You may use this effect as often as you like during your turn.

