name: Solid Rage

origin: unseen-forces-092

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: Attach Solid Rage to 1 of your Evolved Pokémon (excluding Pokémon-ex) that doesn't already have a Pokémon Tool attached to it. If the Pokémon Solid Rage is attached to is a Basic Pokémon or Pokémon-ex, discard Solid Rage.
  - type: effect
    text: If you have more Prize cards left than your opponent, the Pokémon that Solid Rage is attached to does 20 more damage to the Active Pokémon (before applying Weakness and Resistance).

