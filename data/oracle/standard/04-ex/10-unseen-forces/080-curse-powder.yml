name: Curse Powder

origin: unseen-forces-080

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: Attach Curse Powder to 1 of your Evolved Pokémon (excluding Pokémon-ex) that doesn't already have a Pokémon Tool attached to it. If the Pokémon Curse Powder is attached to is a Basic Pokémon or Pokémon-ex, discard Curse Powder.
  - type: effect
    text: If the Pokémon that Curse Powder is attached to is your Active Pokémon and is Knocked Out by damage from an opponent's attack, put 3 damage counters on the Attacking Pokémon.

regulation:

