name: Sitrus Berry

origin: unseen-forces-091

layout: standard

category: Trainer

facet:
  - Pokémon Tool

rule:
  - type: effect
    text: Attach Sitrus Berry to 1 of your Pokémon (excluding Pokémon-ex and Pokémon that has Dark or an owner in its name) that doesn't already have a Pokémon Tool attached to it. If the Pokémon Sitrus Berry is attached to is Pokémon-ex or has Dark or an owner in its name, discard Sitrus Berry.
  - type: effect
    text: At any time between turns, if the Pokémon this card is attached to has at least 3 damage counters on it, remove 3 damage counters from it. Then, discard Sitrus Berry.

regulation:
  - D

errata: []
