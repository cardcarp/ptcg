name: Cessation Crystal

origin: crystal-guardians-074

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Cessation Crystal to 1 of your Pokémon (excluding Pokémon-ex) that doesn't already have a Pokémon Tool attached to it. If the Pokémon Cessation Crystal is attached to is a Pokémon-ex, discard this card.
  - type: Effect
    text: As long as Cessation Crystal is attached to an Active Pokémon, each player's Pokémon (both yours and your opponent's) can't use any Poké-Powers or Poké-Bodies.

