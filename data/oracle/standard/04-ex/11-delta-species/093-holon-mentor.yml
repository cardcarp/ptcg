rule:
  - type: Effect
    text: Discard a card from your hand. If you can't discard a card from your hand, you can't play this card.
  - type: Effect
    text: Search your deck for up to 3 Basic Pokémon that each has 100 HP or less, show them to your opponent, and put them into your hand. Shuffle your deck afterward.

rulebox:
  - You can play only one Supporter card each turn. When you play this card, put it next to your Active Pokémon. When your turn ends, discard this card.

