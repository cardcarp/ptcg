rule:
  - type: Effect
    text: Each player can't have more than 3 Benched Pokémon.
  - type: Effect
    text: When Giant Stump comes into play, each player discards Benched Pokémon and any cards attached to them until he or she has 3 Benched Pokémon. (You discard your Pokémon first.)

rulebox:
  - This card stays in play when you play it. Discard this card if another Stadium card comes into play. If another card with the same name is in play, you can't play this card.

