name: Oran Berry

origin: ruby-sapphire-085

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Oran Berry to 1 of your Pokémon that doesn't already have a Pokémon Tool attached to it. If that Pokémon is Knocked Out, discard this card.
  - type: Effect
    text: At any time between turns, if the Pokémon this card is attached to has at least 2 damage counters on it, remove 2 damage counters from it. Then discard Oran Berry.

