name: Team Magma Belt

origin: team-magma-vs-team-aqua-081

layout: Standard

category:
  - Trainer

trait:
  - Pokémon Tool

rule:
  - type: Effect
    text: Attach Team Magma Belt to 1 of your Pokémon with Team Magma in its name that doesn't already have a Pokémon Tool attached to it. If that Pokémon is Knocked Out, discard this card.
  - type: Effect
    text: At any time between turns, if the Pokémon Team Magma Belt is attached to is your Active Pokémon, search your deck for a card that evolves from that Pokémon and put it on that Pokémon. (This counts as evolving that Pokémon.) Shuffle your deck afterward, then discard Team Magma Belt.

errata: []
