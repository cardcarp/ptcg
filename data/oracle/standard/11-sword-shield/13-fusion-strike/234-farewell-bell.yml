rule:
  - type: Effect
    text: If the Pokémon VMAX this card is attached to is Knocked Out by damage from an attack from your opponent's Pokémon, search your deck for a card and put it into your hand. Then, shuffle your deck.

rulebox:
  - You may play any number of Item cards during your turn.
  - Attach a Pokémon Tool to 1 of your Pokémon that doesn't already have a Pokémon Tool attached.

