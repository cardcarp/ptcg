name: "Blaine's Quiz #3"

origin: gym-challenge-112

layout: Standard

category:
  - Trainer

trait:

rule:
  - type: Effect
    text: Put a Basic or Evolution card from your hand face down in front of you and tell your opponent the name of an attack of that card. Your opponent guesses the name of that card. Flip the card over. If your opponent guessed right, he or she draws 3 cards. If your opponent guessed wrong, you draw 3 cards. Either way, return the card to your hand.

