name: Misty's Wish

origin: gym-challenge-108

layout: standard

category: Trainer

rule:
  - type: effect
    text: Look at 1 of your Prize cards. Then, ask your opponent if you may switch that card with 1 of the cards in your hand. If your opponent accepts and if you have any other cards in your hand, switch those cards. If your opponent declines, return the Prize card face down and draw a card.

