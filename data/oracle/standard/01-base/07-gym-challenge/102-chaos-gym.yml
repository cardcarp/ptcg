name: Chaos Gym

origin: gym-challenge-102

layout: standard

category: Trainer

facet:
  - Stadium

rule:
  - type: effect
    text: Whenever a player plays a Trainer card other than a Stadium card, he or she flips a coin. If heads, that player plays that card normally. If tails, the player can't play that card. If the card isn't put into play, the player's opponent may use that card instead, if he or she does everything required in order to play that card (like discarding cards). Either way, the card goes to its owner's discard pile.

rulebox:
  - This card stays in play after being played. Discard this card if another Stadium card comes into play.

regulation:

errata: []
