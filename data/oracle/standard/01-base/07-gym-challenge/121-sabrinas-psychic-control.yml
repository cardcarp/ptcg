name: Sabrina's Psychic Control

origin: gym-challenge-121

layout: standard

category: Trainer

rule:
  - type: effect
    text: Flip a coin. If heads, choose a Trainer card in your opponent's discard pile that isn't put in play (like PlusPower or Mysterious Fossil). You may use that card as if it were in your hand, if you do everything required in order to play that card (like discarding cards). The card stays in your opponent's discard pile.

