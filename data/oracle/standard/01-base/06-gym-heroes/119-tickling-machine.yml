name: Tickling Machine

origin: gym-heroes-119

layout: Standard

category:
  - Trainer

trait:
  - Rocket's Secret Machine

rule:
  - type: Effect
    text: Flip a coin. If heads, your opponent sets aside all the cards in his or her hand face down. Nobody may look at those cards. At the end of your opponent's next turn, your opponent puts those cards back into his or her hand. If tails, your turn ends immediately (you can't attack this turn).

