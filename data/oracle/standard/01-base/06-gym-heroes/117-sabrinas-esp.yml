name: Sabrina's ESP

origin: gym-heroes-117

layout: standard

category: Trainer

rule:
  - type: effect
    text: Attach Sabrina's ESP to 1 of your Pokémon with Sabrina in its name. At the end of your turn, discard Sabrina's ESP. If that Pokémon uses and attack that involves flipping coins, Sabrina's ESP lets you re-flip those coins once. If you do, re-flip all the coins.

