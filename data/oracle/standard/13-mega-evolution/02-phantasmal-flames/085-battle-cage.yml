name: Battle Cage

origin: phantasmal-flames-085

layout: standard

category: Trainer

facet:
  - Stadium

rule:
  - type: effect
    text: Prevent all damage counters from being placed on Benched Pokémon (both yours and your opponent's) by effects of attacks and Abilities from the opponent's Pokémon. (Damage from attacks is still taken.)

rulebox:
  - You may play only 1 Stadium card during your turn. Put it next to the Active Spot, and discard it if another Stadium comes into play. A Stadium with the same name can't be played.

regulation:
  - I

