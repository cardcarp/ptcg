tagline: Cut through waves and slash foes in the battle arena—flow like water and bend like grass! Greninja and Slowking come to your call in the Wave Slasher theme deck!

description:
  - title: Call the Ocean's Fury!
    body: |
      Cut through waves and slash foes in the battle arena—flow like water and bend like grass! Greninja and Slowking come to your call in the Wave Slasher theme deck!
      Contains 1 complete 60-card deck. Many of the cards exist in multiples to provide a more enjoyable playing experience. All Wave Slasher decks contain the same cards. This package contains everything you need to play the game. Each player must have a 60-card deck of Pokémon cards to play.
      * A playable 60-card deck featuring Water-type Pokémon including Greninja!
      * Includes playmat and rulesheet
      * Ready to play with counters and metallic coin
      * Everything you need to play the Pokémon Trading Card Game
      * Code card for the Pokémon TCG Online

